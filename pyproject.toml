[project]
name = "sensorkit-monitor"
version = "0.2.2"
description = "Monitor application on top of SensorKit."
authors = [
    {name = "Matthew Yacobucci", email = "<yacobucci@gmail.com>"},
]
license = "MIT"
readme = "README.md"
requires-python = ">= 3.11"

dependencies = [
    "starlette (>=0.45.1,<1.0.0)",
    "uvicorn (>=0.34.0,<1.0.0)",
    "prometheus-client (>=0.21.1,<1.0.0)",
    "sensorkit (>=0.4.7,<0.5.0)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.test.dependencies]
rich = "^13.9.4"

